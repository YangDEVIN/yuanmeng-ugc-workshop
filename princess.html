<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公主大冒险 · 2D 小游戏</title><style>
*{box-sizing:border-box}body{background:#231e39;color:#faf0d8;font:16px system-ui;margin:0}main{width:min(100%,760px);margin:auto;padding:18px}a{color:#f2bf99}header,nav,.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:clamp(26px,6vw,46px);margin:12px 0;color:#ffd48a}section{border:5px solid #a44453;border-radius:12px;background:#321f41;overflow:hidden;box-shadow:0 5px #130f20}.hud{font:bold clamp(12px,2.8vw,17px) monospace;padding:10px;color:#ffdc9a}canvas{display:block;width:100%;image-rendering:pixelated}button{font:inherit;color:#311a36;background:#ffe0a3;border:0;border-bottom:4px solid #af8057;border-radius:7px;padding:9px 14px;touch-action:none}button:active{transform:translateY(2px)}nav{margin:16px 0;justify-content:center}#state{min-height:1.5em}small{color:#deccd9}</style></head><body><main><a href="index.html#games">← 2D 小游戏</a><header><h1>公主大冒险</h1><button id="start">开始冒险</button></header><section><div class="hud"><span id="stage"></span><span id="time"></span><span id="rest"></span><span id="score"></span></div><canvas width="256" height="192" aria-label="公主沿冰道奔向城堡"></canvas></section><nav aria-label="游戏操作"><button data-key="left">←</button><button data-key="right">→</button><button data-key="slow">减速</button><button data-key="fast">加速</button><button data-key="jump">跳跃</button><button id="pause">暂停</button></nav><p id="state" role="status"></p><small>方向键控制移动和速度 · 空格跳跃 · P 暂停</small></main><script src="princess.js"></script></body></html>
