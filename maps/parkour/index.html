<!doctype html>
<html lang="zh-CN">
<head><base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跑酷图工坊 · 元梦创作工坊</title>
  <link rel="stylesheet" href="workshop.css">
  <link rel="stylesheet" href="map-workspace.css">
<script src="native-assets.js"></script><script src="map-export.js?v1"></script>
</head>
<body class="workshop map-editor">
  <header class="workshop-bar">
    <nav class="workshop-nav" aria-label="工坊导航">
      <a class="workshop-brand" href="index.html#scenes"><span class="workshop-icon" aria-hidden="true">◫</span>元梦创作工坊</a>
      <a href="maps/fps/index.html">FPS 对战</a>
      <a href="maps/story/index.html">剧情图</a>
      <a href="maps/parkour/index.html" aria-current="page">跑酷图</a>
      <a href="models/animals/index.html">积木模型</a>
    </nav>
  </header>
  <main class="map-main">
    <header class="map-heading"><h1 class="workshop-title"><span class="workshop-icon" aria-hidden="true">⚑</span>跑酷图工坊</h1><button id="parkour-export" class="map-primary">导出</button></header>
    <section class="map-stage" id="parkour-sky-preview" aria-label="跑酷图天空盒预览">
      <div class="map-views"><label class="map-skybox"><span aria-hidden="true">☁</span> 天空盒 <select id="parkour-skybox"></select></label></div>
    </section>
    <p role="status">积木跳台预览 · 可导出当前 7 个跳台；通关、复活与出生点尚未配置。</p>
  </main>
  <script src="lib/three.min.js"></script><script src="brick-material.js"></script><script src="lib/OrbitControls.js"></script>
  <script src="editor-skybox-list.js"></script><script src="campus-skyboxes.js"></script><script src="campus-sky-view.js"></script>
  <script>
    const stage=document.getElementById('parkour-sky-preview');
    const platforms=Array.from({length:7},(_,i)=>({x:(i-3)*2.6,y:i*.35-1,z:Math.sin(i)*1.6,color:[0xe45b38,0xeeb942,0x479d90][i%3]}));
    document.getElementById('parkour-export').onclick=()=>MapExport.open(()=>({schema:'yuanmeng-custom-project/v1',map:'parkour',name:'跑酷地图',placement:{map:'parkour',coordinates:{units:'cm'},count:platforms.length,batchItemIds:[platforms.map((_,i)=>'platform-'+i)],commands:[{tool:'ugc_create_entity',arguments:{items:platforms.map(p=>({typeId:'1101002001034000',snapToGround:false,color:{r:p.color>>16,g:(p.color>>8)&255,b:p.color&255},transform:{location:{x:p.x*100,y:-p.z*100,z:(p.y-.325)*100},rotation:{pitch:0,yaw:0,roll:0},scale:{x:2.4,y:2,z:.65}}}))}}]},atmosphere:{skybox:YuanmengSkyboxes.exportPreset(Number(document.getElementById('parkour-skybox').value))},gameplay:{runtimeBinding:'required'},verification:{layout:'unverified',playtest:'unverified'}}));
    let renderer=null;
    try{renderer=new THREE.WebGLRenderer({antialias:true});}catch{}
    const sky=renderer?createMapSky(THREE):null;
    YuanmengSkyboxes.bind(document.getElementById('parkour-skybox'),{key:'parkour-skybox',initial:1,onChange(profile){
      sky?.setProfile(profile);
      const css=n=>'#'+n.toString(16).padStart(6,'0');
      stage.style.background='linear-gradient('+css(profile.zenith)+','+css(profile.horizon)+' 69%,'+css(profile.ground)+')';
    }});
    if(renderer){
      const scene=new THREE.Scene();scene.add(sky.mesh);
      const camera=new THREE.PerspectiveCamera(58,1,.1,1000);camera.position.set(8,7,13); scene.add(new THREE.HemisphereLight(0xffffff,0x788998,1.5)); for(const p of platforms){const platform=new THREE.Mesh(new THREE.BoxGeometry(2.4,.65,2),brickMaterial(new THREE.MeshLambertMaterial({color:p.color}),.5)); platform.position.set(p.x,p.y,p.z);scene.add(platform);}
      const orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enablePan=false;orbit.enableZoom=false;
      renderer.domElement.className='map-canvas';renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));stage.prepend(renderer.domElement);
      new ResizeObserver(()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight,false);}).observe(stage);
      function paint(){sky.followCamera(camera);renderer.render(scene,camera);requestAnimationFrame(paint);}
      requestAnimationFrame(paint);
    }
  </script>
</body>
</html>
