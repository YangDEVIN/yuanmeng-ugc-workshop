<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>积木模型工坊 · 元梦创作工坊</title>
<style>
  :root{
    --red:#E3350D; --yellow:#FFC400; --blue:#1B6FD1; --green:#2BA84A;
    --ink:#23262B; --mute:#6B7280; --line:#E4E7EC; --bg:#F6F4EE; --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  body{display:flex;flex-direction:column;overflow:hidden}

  header{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--red);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .logo{display:flex;gap:3px}
  .logo i{width:16px;height:16px;border-radius:3px;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  header h1{font-size:19px;margin:0;letter-spacing:.5px}
  header .miniNav{display:flex;gap:6px;margin-left:8px}
  header .miniNav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:5px 9px;border-radius:8px;font-size:11.5px;white-space:nowrap}
  header .miniNav a:hover{background:rgba(255,255,255,.16)}

  main{flex:1;min-height:0;display:grid;grid-template-columns:232px 1fr 340px}

  /* 左：动物列表 */
  #list{overflow-y:auto;padding:14px 12px;background:#fff;border-right:1px solid var(--line)}
  #list h2,#side h2{font-size:12px;color:var(--mute);margin:2px 4px 10px;font-weight:600;letter-spacing:1px}
  .card{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;border:2px solid transparent;cursor:pointer;margin-bottom:6px;transition:.15s}
  .card:hover{background:#F8F6F0}
  .card.on{border-color:var(--yellow);background:#FFF9E2}
  .card img{width:62px;height:62px;border-radius:10px;background:#EFEBDD;flex:none}
  .card b{display:block;font-size:15px}
  .card small{color:var(--mute);font-size:12px}

  /* 中：预览 */
  #stage{position:relative;min-width:0}
  #view{position:absolute;inset:0}
  #view canvas{display:block}
  .toolbar{position:absolute;left:14px;top:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
  .seg{display:flex;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden}
  .seg button{border:0;background:none;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--blue);color:#fff}
  .chip{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:8px 13px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
  .title{position:absolute;left:18px;top:62px;z-index:2;pointer-events:none}
  .title .n{font-size:30px;font-weight:800}
  .layerbar{position:absolute;left:18px;right:18px;bottom:14px;z-index:2;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:9px 16px;display:flex;align-items:center;gap:12px;font-size:13px}
  .layerbar input{flex:1;accent-color:var(--blue)}
  #tip{position:fixed;z-index:9;pointer-events:none;background:rgba(35,38,43,.92);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;display:none;white-space:nowrap}
  #tip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}

  /* 右：参数 */
  #side{overflow-y:auto;padding:16px 16px 22px;background:#fff;border-left:1px solid var(--line)}
  .box{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .stats div{background:#F8F6F0;border-radius:10px;padding:8px 2px}
  .stats b{display:block;font-size:19px}
  .stats small{font-size:11.5px;color:var(--mute)}
  .parts{display:flex;flex-direction:column;gap:5px;margin-top:11px}
  .part{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:8px;cursor:pointer}
  .part:hover{background:#F6F4EE}
  .part.on{background:#FFF3C4}
  .part i{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:none}
  .part span{margin-left:auto;color:var(--mute)}
  label.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:9px 0}
  label.row>span{width:54px;color:var(--mute);flex:none;white-space:nowrap}
  label.row small{white-space:nowrap;color:var(--mute)}
  input[type=number]{width:64px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  input[type=range]{flex:1;accent-color:var(--blue);min-width:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer}
  .chips button:hover{border-color:var(--blue);color:var(--blue)}
  .radios{display:flex;flex-direction:column;gap:7px;margin:6px 0 2px}
  .radios label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .radios label.on{border-color:var(--blue);background:#EEF5FF}
  .radios small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
  .sum{background:#F8F6F0;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.75;margin-top:6px}
  .sum b{color:var(--red)}
  .btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);margin-top:6px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13px;padding:9px;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:#23262B;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  @media (max-width:1100px){ main{grid-template-columns:180px 1fr 310px} }
</style>
</head>
<body>
<header>
  <div class="logo"><i style="background:#FFC400"></i><i style="background:#1B6FD1"></i><i style="background:#2BA84A"></i></div>
  <h1>积木模型工坊</h1>
  <nav class="miniNav"><a href="../index.html#models">模型工坊首页</a><a href="../maps.html">地图场景工坊</a></nav>
</header>

<main>
  <aside id="list"><h2>动物模型</h2><div id="cards"></div></aside>

  <section id="stage">
    <div class="toolbar">
      <div class="seg" id="viewSeg">
        <button data-v="brick" class="on">🧱 乐高积木</button>
        <button data-v="merge">📦 元梦合并块</button>
      </div>
      <label class="chip"><input type="checkbox" id="auto" checked> 自动旋转</label>
      <div class="chip" id="reset">↺ 重置视角</div>
    </div>
    <div id="view"></div>
    <div class="title"><div class="n" id="tName"></div></div>
    <div class="layerbar">
      <span>按层拆看</span>
      <input type="range" id="layer" min="1" max="10" value="10">
      <span id="layerTxt" style="width:96px;text-align:right"></span>
    </div>
  </section>

  <aside id="side">
    <div class="box">
      <h2>积木清单</h2>
      <div class="stats">
        <div><b id="sBricks">-</b><small>积木块数</small></div>
        <div><b id="sSize">-</b><small>格 宽×高×长</small></div>
        <div><b id="sColors">-</b><small>种颜色</small></div>
      </div>
      <div class="parts" id="parts"></div>
    </div>

    <div class="box">
      <h2>在元梦里生成</h2>
      <label class="row"><span>每块边长</span><input type="range" id="size" min="5" max="200" step="1" value="30"><input type="number" id="sizeN" min="5" max="400" value="30"><small>cm</small></label>
      <div class="chips" id="presets"></div>
      <label class="row"><span>想要高度</span><input type="number" id="hN" min="10" value="" placeholder="自动"><small>cm（反推边长）</small></label>
      <label class="row"><span>位置 X</span><input type="number" id="px" value="0"><span style="width:auto">Y</span><input type="number" id="py" value="0"></label>
      <label class="row"><span>离地 Z</span><input type="number" id="pz" value="0"><span style="width:auto">朝向</span><input type="number" id="yaw" value="0"><small>°</small></label>

      <div class="radios" id="modes">
        <label class="on" data-m="merge"><input type="radio" name="m" checked hidden><div><b>合并块</b><small id="mMerge"></small></div></label>
        <label data-m="single"><input type="radio" name="m" hidden><div><b>逐块乐高</b><small id="mSingle"></small></div></label>
      </div>

      <div class="sum" id="sum"></div>
      <button class="btn" id="copy">📋 复制生成口令</button>
      <button class="btn ghost" id="dl">⬇ 下载订单文件 (.json)</button>
    </div>
  </aside>
</main>

<div id="tip"></div>
<div id="toast"></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="models.js"></script>
<script>
(function(){
  const { PAL, MODELS, buildPlacement } = LegoZoo;
  const $ = s => document.querySelector(s);
  const state = { model: MODELS[0], view: 'brick', layer: 99, focus: null, mode: 'merge', size: 30 };

  // ---------- 通用：建模型 group ----------
  const boxGeo = new THREE.BoxGeometry(0.96, 0.96, 0.96);
  const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 20);
  const matBrick = new THREE.MeshPhongMaterial({ shininess: 70, specular: 0x444444 });
  const matStud = matBrick;
  const GREY = new THREE.Color('#D9D9D4');

  function colorOf(c, focus){
    const col = new THREE.Color(PAL[c].hex);
    if (focus && focus !== c) col.lerp(GREY, 0.82);
    return col;
  }

  function buildBrickGroup(m, layer, focus){
    const g = new THREE.Group();
    const vox = m.vox.filter(v => v.y < layer);
    const has = new Set(m.vox.filter(v => v.y < layer).map(v => v.x+','+v.y+','+v.z));
    const ox = m.w/2, oz = m.d/2;
    const bricks = new THREE.InstancedMesh(boxGeo, matBrick, vox.length);
    const studsList = vox.filter(v => !has.has(v.x+','+(v.y+1)+','+v.z));
    const studs = new THREE.InstancedMesh(studGeo, matStud, studsList.length);
    const M = new THREE.Matrix4();
    vox.forEach((v,i)=>{
      M.makeTranslation(v.x+0.5-ox, v.y+0.5, v.z+0.5-oz);
      bricks.setMatrixAt(i, M); bricks.setColorAt(i, colorOf(v.c, focus));
    });
    studsList.forEach((v,i)=>{
      M.makeTranslation(v.x+0.5-ox, v.y+1.08, v.z+0.5-oz);
      studs.setMatrixAt(i, M); studs.setColorAt(i, colorOf(v.c, focus));
    });
    bricks.castShadow = studs.castShadow = true;
    bricks.userData = { list: vox };
    g.add(bricks, studs);
    g.userData.pick = bricks;
    return g;
  }

  function buildMergeGroup(m, layer, focus){
    const g = new THREE.Group();
    const ox = m.w/2, oz = m.d/2;
    const picks = [];
    m.merged.forEach(b=>{
      // 按层裁剪
      if (b.y >= layer) return;
      const dy = Math.min(b.dy, layer - b.y);
      const geo = new THREE.BoxGeometry(b.dx, dy, b.dz);
      const mat = new THREE.MeshPhongMaterial({ color: colorOf(b.c, focus), shininess: 40, specular: 0x333333 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(b.x + b.dx/2 - ox, b.y + dy/2, b.z + b.dz/2 - oz);
      mesh.castShadow = true;
      mesh.userData = { b };
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x2b2d33, transparent:true, opacity:.55 }));
      mesh.add(edges);
      g.add(mesh); picks.push(mesh);
    });
    g.userData.picks = picks;
    return g;
  }

  function buildBase(m){
    const g = new THREE.Group();
    const bw = m.w + 6, bd = m.d + 6;
    const plate = new THREE.Mesh(new THREE.BoxGeometry(bw, 0.5, bd), new THREE.MeshPhongMaterial({ color: 0x3FA55A, shininess: 40 }));
    plate.position.y = -0.25; plate.receiveShadow = true;
    g.add(plate);
    const n = bw * bd;
    const st = new THREE.InstancedMesh(studGeo, new THREE.MeshPhongMaterial({ color: 0x3FA55A, shininess: 50 }), n);
    const M = new THREE.Matrix4(); let i = 0;
    for (let x=0;x<bw;x++) for (let z=0;z<bd;z++){
      M.makeTranslation(x+0.5-bw/2, 0.1, z+0.5-bd/2); st.setMatrixAt(i++, M);
    }
    st.receiveShadow = true;
    g.add(st);
    return g;
  }

  function addLights(scene, size){
    scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc8b8, 0.78));
    const d = new THREE.DirectionalLight(0xffffff, 0.62);
    d.position.set(size*0.9, size*1.6, size*1.1);
    d.castShadow = true;
    d.shadow.mapSize.set(2048, 2048);
    const s = size * 1.2;
    Object.assign(d.shadow.camera, { left:-s, right:s, top:s, bottom:-s, near:1, far:size*6 });
    d.shadow.bias = -0.0008;
    scene.add(d);
  }

  // ---------- 主场景 ----------
  const host = $('#view');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xF1EEE4);
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
  controls.maxPolarAngle = Math.PI * 0.495;

  let modelGroup = null, baseGroup = null, lights = null;

  function fitCamera(m){
    const r = Math.max(m.w, m.h, m.d);
    const dist = Math.max(m.h * 2.6, r * 2.4) + 4;
    const dir = new THREE.Vector3(0.55, 0.38, 0.85).normalize();
    camera.position.copy(dir.multiplyScalar(dist)).add(new THREE.Vector3(0, m.h*0.42, 0));
    controls.target.set(0, m.h*0.42, 0);
    controls.minDistance = r*0.9; controls.maxDistance = r*7;
    controls.update();
  }

  function rebuild(resetCam){
    const m = state.model;
    if (modelGroup) scene.remove(modelGroup);
    if (baseGroup) scene.remove(baseGroup);
    if (!lights){
      lights = new THREE.Group(); scene.add(lights);
      const keep = scene.children.length;
      addLights(scene, 22);
    }
    baseGroup = buildBase(m); scene.add(baseGroup);
    modelGroup = state.view === 'brick'
      ? buildBrickGroup(m, state.layer, state.focus)
      : buildMergeGroup(m, state.layer, state.focus);
    scene.add(modelGroup);
    if (resetCam) fitCamera(m);
  }

  function resize(){
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  // ---------- 悬停提示 ----------
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('#tip');
  renderer.domElement.addEventListener('pointermove', e=>{
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse, camera);
    let info = null;
    if (state.view === 'brick'){
      const pick = modelGroup.userData.pick;
      const hit = ray.intersectObject(pick)[0];
      if (hit && hit.instanceId != null){
        const v = pick.userData.list[hit.instanceId];
        info = { c: v.c, text: `第 ${v.y+1} 层 · ${PAL[v.c].name}` };
      }
    } else {
      const hit = ray.intersectObjects(modelGroup.userData.picks)[0];
      if (hit){
        const b = hit.object.userData.b;
        info = { c: b.c, text: `${PAL[b.c].name} · ${b.dx}×${b.dz}×${b.dy} 格（合并成 1 个元梦方块）` };
      }
    }
    if (info){
      tip.style.display = 'block'; tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+14)+'px';
      tip.innerHTML = `<i style="background:${PAL[info.c].hex}"></i>${info.text}`;
    } else tip.style.display = 'none';
  });
  renderer.domElement.addEventListener('pointerleave', ()=> tip.style.display='none');

  // ---------- 缩略图 ----------
  function makeThumbs(){
    const tr = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
    tr.setSize(180,180); tr.setPixelRatio(1);
    tr.shadowMap.enabled = true;
    const out = {};
    MODELS.forEach(m=>{
      const sc = new THREE.Scene();
      addLights(sc, 22);
      sc.add(buildBrickGroup(m, 99, null));
      const cam = new THREE.PerspectiveCamera(34,1,0.1,300);
      const r = Math.max(m.w,m.h,m.d);
      cam.position.set(r*1.15, m.h*0.7 + r*0.35, r*1.5);
      cam.lookAt(0, m.h*0.46, 0);
      tr.render(sc, cam);
      out[m.id] = tr.domElement.toDataURL('image/png');
    });
    tr.dispose();
    return out;
  }

  // ---------- 左侧列表 ----------
  const thumbs = makeThumbs();
  const cards = $('#cards');
  MODELS.forEach(m=>{
    const el = document.createElement('div');
    el.className = 'card'; el.dataset.id = m.id;
    el.innerHTML = `<img src="${thumbs[m.id]}" alt=""><div><b>${m.emoji} ${m.name}</b><small>${m.vox.length} 块积木</small></div>`;
    el.onclick = ()=> select(m);
    cards.appendChild(el);
  });

  // ---------- 选择模型 ----------
  function select(m){
    state.model = m; state.focus = null; state.layer = m.h;
    document.querySelectorAll('.card').forEach(c=> c.classList.toggle('on', c.dataset.id === m.id));
    $('#tName').textContent = `${m.emoji} ${m.name}`;
    const L = $('#layer'); L.max = m.h; L.value = m.h;
    $('#sBricks').textContent = m.vox.length;
    $('#sSize').textContent = `${m.w}×${m.h}×${m.d}`;
    const counts = {};
    m.vox.forEach(v=> counts[v.c] = (counts[v.c]||0)+1);
    $('#sColors').textContent = Object.keys(counts).length;
    const parts = $('#parts'); parts.innerHTML = '';
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{
      const p = document.createElement('div'); p.className='part'; p.dataset.c=c;
      p.innerHTML = `<i style="background:${PAL[c].hex}"></i>${PAL[c].name}<span>${n} 块</span>`;
      p.onclick = ()=>{
        state.focus = state.focus === c ? null : c;
        document.querySelectorAll('.part').forEach(x=> x.classList.toggle('on', x.dataset.c === state.focus));
        rebuild(false);
      };
      parts.appendChild(p);
    });
    $('#mMerge').textContent = `${m.merged.length} 个实体`;
    $('#mSingle').textContent = `${m.vox.length} 个实体`;
    layerText(); rebuild(true); updateSum();
  }

  function layerText(){ $('#layerTxt').textContent = `第 1–${state.layer} 层 / 共 ${state.model.h} 层`; }
  $('#layer').oninput = e=>{ state.layer = +e.target.value; layerText(); rebuild(false); };

  document.querySelectorAll('#viewSeg button').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('#viewSeg button').forEach(x=> x.classList.toggle('on', x===b));
    state.view = b.dataset.v; rebuild(false);
  });
  $('#auto').onchange = e=> controls.autoRotate = e.target.checked;
  $('#reset').onclick = ()=> fitCamera(state.model);

  // ---------- 生成参数 ----------
  const sizeR = $('#size'), sizeN = $('#sizeN'), hN = $('#hN');
  function setSize(v){
    v = Math.max(5, Math.min(400, +v || 30));
    state.size = v; sizeN.value = v; sizeR.value = Math.min(v, 200);
    hN.value = '';
    updateSum();
  }
  sizeR.oninput = ()=> setSize(sizeR.value);
  sizeN.onchange = ()=> setSize(sizeN.value);
  hN.onchange = ()=>{ if (hN.value) setSize(Math.round(+hN.value / state.model.h)); };
  [[10,'迷你'],[20,'桌面'],[30,'小型'],[50,'中型'],[100,'巨型']].forEach(([v,t])=>{
    const b = document.createElement('button'); b.textContent = `${t} ${v}cm/块`;
    b.onclick = ()=> setSize(v); $('#presets').appendChild(b);
  });
  document.querySelectorAll('#modes label').forEach(l=> l.onclick = ()=>{
    state.mode = l.dataset.m;
    document.querySelectorAll('#modes label').forEach(x=> x.classList.toggle('on', x===l));
    updateSum();
  });
  ['px','py','pz','yaw'].forEach(id=> $('#'+id).oninput = updateSum);

  const num = id => +$('#'+id).value || 0;
  function currentSpec(){
    return { animal: state.model.id, name: state.model.name, size: state.size,
             x: num('px'), y: num('py'), z: num('pz'), yaw: num('yaw'), mode: state.mode };
  }
  function updateSum(){
    const m = state.model, s = currentSpec();
    const W = m.d * s.size, H = m.h * s.size, D = m.w * s.size; // 元梦里：X=向前(模型z)，Y=左右(模型x)
    const cnt = s.mode === 'merge' ? m.merged.length : m.vox.length;
    $('#sum').innerHTML =
      `整体大小：长 <b>${W}</b> × 宽 <b>${D}</b> × 高 <b>${H}</b> cm<br>` +
      `缩放比例：每块 ${s.size}cm（标准方块的 <b>${(s.size/100).toFixed(2)}</b> 倍）<br>` +
      `将生成 <b>${cnt}</b> 个实体` + (cnt > 300 ? ' <span style="color:#d97706">（数量偏多，建议改用合并块）</span>' : '');
  }

  // ---------- 输出口令 ----------
  function orderText(){
    const s = currentSpec(), m = state.model;
    const cnt = s.mode === 'merge' ? m.merged.length : m.vox.length;
    const modeTxt = s.mode === 'merge' ? '合并块' : '逐块乐高';
    const json = JSON.stringify({ animal: s.animal, size: s.size, x: s.x, y: s.y, z: s.z, yaw: s.yaw, mode: s.mode });
    return `请在元梦里生成乐高动物【${s.name}】：每块边长 ${s.size}cm，位置 X=${s.x} Y=${s.y} Z=${s.z}，朝向 ${s.yaw}°，方式：${modeTxt}（约 ${cnt} 个实体）。\n订单：${json}`;
  }
  function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=> e.classList.remove('show'), 2400); }
  $('#copy').onclick = async ()=>{
    const t = orderText();
    try { await navigator.clipboard.writeText(t); }
    catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast('已复制！把它发给元梦助手就能生成');
  };
  $('#dl').onclick = ()=>{
    const s = currentSpec();
    const blob = new Blob([JSON.stringify(s, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `lego-${s.animal}-${s.size}cm.json`; a.click();
    toast('订单文件已下载');
  };

  // ---------- 启动 ----------
  resize();
  select(MODELS[0]);
  window.__lego = { camera, controls, host };
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
