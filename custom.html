<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自定义仓库 · 元梦创作工坊</title><link rel="stylesheet" href="workshop.css?v7"><link rel="stylesheet" href="custom.css?v7"><script src="workshop-bridge.js?v8"></script></head>
<body class="workshop"><header class="workshop-bar"><nav class="workshop-nav"><a class="workshop-brand" href="index.html"><span class="workshop-icon" aria-hidden="true">◈</span>元梦创作工坊</a><a href="maps.html">FPS</a><a href="story.html">剧情</a><a href="custom.html" aria-current="page">自定义仓库</a><button id="connection" class="status-chip">◌ 检测元梦连接</button></nav></header>
<main class="custom-main"><header class="custom-heading"><h1><span class="workshop-icon" aria-hidden="true">▧</span> 自定义仓库</h1><div class="actions"><button id="library-open">▦ 我的地图</button><label class="button primary">↑ 导入 JSON<input type="file" id="upload" accept=".json,application/json" hidden></label><button id="new-map">＋ 新建</button><button id="export">↓ 导出 JSON</button></div></header>
<div class="custom-layout"><section class="preview-panel"><div class="preview-title"><input id="map-name" aria-label="地图名称" value="未命名地图" maxlength="100"><span id="map-count">0 个元件</span><button id="save-map">保存到仓库</button></div><iframe id="preview" title="地图 3D 浏览与编辑"></iframe><p id="notice" role="status"></p></section>
<aside class="chat-panel"><div class="chat-heading"><h2>✦ 地图 Agent</h2><button id="agent-settings" aria-label="Agent 连接设置">⚙</button></div><label>Agent<select id="agent"><option value="workbuddy">WorkBuddy</option><option value="codebuddy">CodeBuddy</option><option value="codex" selected>Codex</option><option value="claude">Claude</option><option value="devin">Devin</option><option value="deepseek">DeepSeek</option></select></label><p id="agent-status" role="status">正在检测本地 Agent…</p><div id="messages" role="log" aria-live="polite"></div><button id="apply" class="primary" hidden>查看并应用新版本</button><form id="chat-form"><label for="task">地图需求</label><textarea id="task" rows="4" placeholder="把校园改成雨夜，增加一条通往图书馆的走廊…" required maxlength="12000"></textarea><button id="send" class="primary" type="submit">↗ 打开 Agent 并发送</button></form><div class="prompt-actions"><button id="copy-prompt">复制生成提示词</button><a class="button" href="提示词.md" download>下载 .md</a></div></aside></div></main>
<dialog id="library"><form method="dialog" class="dialog-heading"><h2>我的地图</h2><button aria-label="关闭">×</button></form><div id="library-list"></div></dialog>
<dialog id="connect-dialog"><form method="dialog" class="dialog-heading"><h2>元梦连接</h2><button aria-label="关闭">×</button></form><p id="connection-detail"></p><pre id="connection-help"></pre><button id="retry">重新检测</button></dialog>
<dialog id="settings"><form method="dialog" class="dialog-heading"><h2>Agent 连接</h2><button aria-label="关闭">×</button></form><p id="settings-agent"></p><form id="settings-form"><label>本地程序完整路径<input id="executable" placeholder="C:\…\agent.exe" required></label><label>启动参数（JSON 数组）<textarea id="arguments" rows="4">["{prompt}"]</textarea></label><p>参数可使用 {prompt}、{taskFile}、{resultFile}、{workspace}。GUI 程序未提供提示词接口时，打开后粘贴任务即可；结果写入约定文件会回到网页。</p><button class="primary">保存连接</button></form><p id="settings-status" role="status"></p></dialog>
<script src="native-assets.js?v7"></script><script src="map-draft.js?v7"></script><script src="custom-map.js?v7"></script><script src="draft-store.js?v7"></script><script src="custom.js?v8"></script></body></html>
