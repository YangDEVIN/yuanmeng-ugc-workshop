<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乐高小人模型 · 元梦创作工坊</title><link rel="stylesheet" href="workshop.css"><style>body{margin:0}header{display:flex;align-items:center;gap:24px;padding:18px 4%;background:#fffaf2;border-bottom:1px solid #d8c8ad}.workshop header h1{font-size:22px;margin:0}main{display:grid;grid-template-columns:210px 1fr 240px;min-height:calc(100vh - 75px)}aside{background:#fffaf2;padding:24px;border-right:1px solid #d8c8ad}aside h2{font-size:15px;color:#786954}button{font:inherit;cursor:pointer;padding:12px;border:1px solid #d8c8ad;border-radius:10px;background:white;color:#40382f}#models button{width:100%;text-align:left;margin-bottom:10px}#models button[aria-pressed=true]{background:#fff0c5;border:2px solid #d9a334}.swatch{display:inline-block;width:24px;height:24px;border-radius:7px;vertical-align:middle;margin-right:10px}#stage{position:relative;min-height:570px;background:#dcdde0}canvas{display:block;width:100%;height:100%}.controls{position:absolute;left:18px;top:18px;display:flex;gap:8px;flex-wrap:wrap}p,li{font-size:14px;line-height:1.8;color:#756958}#info{border-left:1px solid #d8c8ad}#info strong{font-size:22px;display:block;margin:14px 0}label{display:block;margin:16px 0}#error{position:absolute;bottom:15px;left:20px}@media(max-width:850px){main{grid-template-columns:150px 1fr}#info{grid-column:1/-1}aside{padding:14px}#stage{min-height:480px}}@media(max-width:540px){main{grid-template-columns:1fr}#models{display:flex;gap:8px;flex-wrap:wrap}#models button{width:auto;margin:0}#models h2{width:100%}}</style></head><body class="workshop"><header><a href="index.html#models">← 模型工坊</a><h1>乐高小人模型</h1><a href="animals/index.html">动物积木模型</a></header><main><aside id="models"><h2>小人模型</h2><button data-model="0" aria-pressed="true"><span class="swatch" style="background:#e9e5dc"></span>基础白模</button><button data-model="1" aria-pressed="false"><span class="swatch" style="background:#df80a5"></span>蔷薇公主</button><button data-model="2" aria-pressed="false"><span class="swatch" style="background:#62bfc4"></span>潮汐公主</button><button data-model="3" aria-pressed="false"><span class="swatch" style="background:#9381bf"></span>星砂公主</button></aside><section id="stage" aria-label="积木小人三维预览"><div class="controls"><button id="reset">重置视角</button><button id="rotate" aria-pressed="false">自动旋转</button><button id="wire" aria-pressed="false">线框</button></div><p id="error" role="status"></p></section><aside id="info"><h2>模型信息</h2><strong id="name">基础白模</strong><p>圆柱头部 · 梯形躯干 · 分体腿部 · C 形手掌</p><p id="parts"></p><label><input id="face" type="checkbox" checked> 表情附加贴片</label><p>拖动查看正面、侧面和背面，滚轮缩放。</p><h2>构件结构</h2><ul><li>头部与顶部连接凸点</li><li>肩轴、手臂与腕部</li><li>腰髋与双腿</li><li>独立头饰与表情层</li></ul><p>原创参数化积木风预览模型；未使用品牌标识。此页仅展示模型，不包含地图和小游戏。</p></aside></main><script src="lib/three.min.js"></script><script src="lib/OrbitControls.js"></script><script src="minifigure.js"></script></body></html>
