<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯方块 · 2D 小游戏</title><link rel="stylesheet" href="workshop.css"><style>
body{background:#f1eee4;color:#202f36;font-family:"Segoe UI",sans-serif;margin:0}main{max-width:700px;margin:auto;padding:24px}a{color:#28574d}h1{font-size:clamp(2rem,6vw,3.6rem);margin:.35em 0}.console{display:flex;gap:clamp(10px,4vw,34px);padding:clamp(12px,4vw,28px);border-radius:20px;background:#173d40;color:#fff;align-items:flex-start;box-shadow:0 6px #0e292b}canvas{width:52%;height:auto;border-radius:6px;background:#102c30}aside{flex:1}output{display:block;font: bold 2rem monospace;color:#ffcc77;margin:6px 0 1em}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.65em .85em;margin:3px;background:#fff4db;color:#1c3838}button:focus-visible{outline:3px solid #ef774f}footer{margin:24px 0}#message{overflow-wrap:anywhere}
