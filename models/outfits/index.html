<!doctype html>
<html lang="zh-CN">
<head><base href="../../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>换装专区 · 元梦创作工坊</title>
<link rel="stylesheet" href="workshop.css">
<style>
  main {width:min(1200px,94%);margin:24px auto}
  h1 {font-size:26px}
  .fitting {display:grid;grid-template-columns:minmax(0,2fr) minmax(235px,1fr);gap:16px}
  #stage,aside {border:1px solid var(--line);border-radius:20px;overflow:hidden}
  #stage {position:relative;height:clamp(360px,65vh,680px);background:#e8e3fa;touch-action:none}
  #stage canvas {display:block}
  .badge {position:absolute;left:16px;top:16px;background:#fff;padding:8px 12px;border-radius:10px;pointer-events:none}
  aside {background:white;padding:20px;display:grid;align-content:start;gap:14px}
  aside h2 {margin:0;font-size:20px}
  label {display:grid;gap:5px;font-weight:600}
  select,button {font:inherit;color:inherit;background:#fbf9ff;border:1px solid #d7ccea;border-radius:10px;padding:9px}
  button {cursor:pointer}
  #gallery {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #gallery button {text-align:left;min-height:59px}
  #gallery button[aria-pressed="true"] {background:#dcebe8;border-color:#538581}
  #gallery small,#gallery strong {display:block}
  #gallery small {color:#506b69}
  details label {margin:8px 0}
  @media(max-width:650px){.fitting{grid-template-columns:1fr} #stage{height:400px}}
</style>
<script defer src="models/animals/lib/three.min.js"></script>
<script defer src="models/animals/lib/OrbitControls.js"></script>
<script defer src="dress-up.js?v9"></script>
</head>
<body class="workshop">
<header class="workshop-bar"><nav class="workshop-nav" aria-label="模型工坊">
  <a class="workshop-brand" href="index.html#models"><span class="workshop-icon" aria-hidden="true">▦</span>模型工坊</a>
  <a href="models/animals/index.html">积木模型</a><a href="models/outfits/index.html" aria-current="page">换装专区</a>
</nav></header>
<main>
  <h1 class="workshop-title"><span class="workshop-icon" aria-hidden="true">♢</span>换装专区</h1>
  <section class="fitting" aria-label="试衣间">
    <div id="stage" aria-label="星宝换装三维预览"><span class="badge" id="preview-title">青岚 · 全身试穿</span><p id="render-error" role="status" hidden></p></div>
    <aside>
      <h2>装备图鉴</h2>
      <div id="gallery" aria-label="装备预览"></div>
      <details><summary>搭配设置</summary>
      <label>衣服<select id="shirt"><option value="">无</option><option value="royal" selected>青瓷短衫</option><option value="varsity">紫罗兰夹克</option><option value="mint">薄荷卫衣</option></select></label>
      <label>裤子<select id="pants"><option value="" selected>无</option><option value="navy">深蓝长裤</option><option value="sand">沙色长裤</option></select></label>
      <label>裙子<select id="skirt"><option value="">无</option><option value="rose" selected>杏花裙</option><option value="lilac">浅紫百褶裙</option></select></label>
      <label>帽子<select id="hat"><option value="">无</option><option value="berry">莓紫礼帽</option><option value="cream">奶油礼帽</option></select></label>
      <label>翅膀<select id="wings"><option value="">无</option><option value="dawn">晨曦羽翼</option><option value="moon">月影羽翼</option></select></label>
      </details>
      <button id="turn" type="button" aria-pressed="false">查看背面</button>
      <button id="export" type="button">导出元梦试装 JSON</button>
      <button id="reset" type="button">恢复初始星宝</button>
    </aside>
  </section>
</main>
</body>
</html>
